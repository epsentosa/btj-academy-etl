services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: btj-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    # volumes:
    #   - ./dockervol/rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: btj-academy
      RABBITMQ_DEFAULT_PASS: btj-academy
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Jakarta
    networks:
      - btj-network

  redis:
    image: redis:8
    container_name: btj-redis
    ports:
      - "127.0.0.1:6379:6379"
    # volumes:
    #   - ./dockervol/redis-data:/data
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    networks:
      - btj-network

  postgres:
    image: timescale/timescaledb:2.14.1-pg15
    container_name: btj-timescale
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    volumes:
      - ./dockervol/postgres-data:/var/lib/postgresql/data
    environment:
      TZ: Asia/Jakarta
      POSTGRES_USER: btj-academy
      POSTGRES_PASSWORD: btj-academy
      POSTGRES_DB: btj-academy
    networks:
      - btj-network

  sftp:
    image: atmoz/sftp
    container_name: btj-sftp
    ports:
      - "127.0.0.1:2222:22"
    restart: unless-stopped
    volumes:
      - ./dockervol/sftp-data:/home/btj-academy/upload
    environment:
      TZ: Asia/Jakarta
      SFTP_USERS: btj-academy:btj-academy:::upload
    networks:
      - btj-network

  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: btj-processor
    ports:
      - "3000:3000"
    environment:
      DB_URL: postgresql://btj-academy:btj-academy@postgres:5432/btj-academy
      REDIS_PM_HOST: redis
      REDIS_PM_DB: "1"
      LOG_LEVEL: INFO
    depends_on:
      - postgres
      - redis
    networks:
      - btj-network
    volumes:
      - ./processor:/app

networks:
  btj-network:
    name: btj-network
    driver: bridge
